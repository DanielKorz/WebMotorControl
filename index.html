<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101426">
  <title>Hello, world!</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101426;
      color: #f7f7ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 18% 20%, #4a3c8c 0, transparent 38%),
        radial-gradient(ellipse at 85% 82%, #174f66 0, transparent 34%),
        #101426;
    }

    main {
      width: min(100%, 620px);
      padding: clamp(32px, 8vw, 64px);
      text-align: center;
      border: 1px solid rgb(255 255 255 / 14%);
      border-radius: 28px;
      background: rgb(255 255 255 / 7%);
      box-shadow: 0 24px 80px rgb(0 0 0 / 30%);
      backdrop-filter: blur(14px);
    }

    .sparkle {
      display: inline-grid;
      width: 76px;
      height: 76px;
      place-items: center;
      margin-bottom: 24px;
      border-radius: 24px;
      background: linear-gradient(135deg, #ffb86c, #ff6b9a);
      font-size: 38px;
      box-shadow: 0 12px 32px rgb(255 107 154 / 25%);
    }

    p {
      margin: 0 0 12px;
      color: #c7c9dc;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.7rem, 9vw, 5rem);
      letter-spacing: -0.07em;
      line-height: 1;
    }

    h1 span {
      color: #ff9bb8;
    }

    .message {
      min-height: 1.6em;
      margin: 22px 0 28px;
      color: #c7c9dc;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 14px 24px;
      background: #f7f7ff;
      color: #17182b;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgb(0 0 0 / 24%);
    }

    button:focus-visible {
      outline: 3px solid #ff9bb8;
      outline-offset: 4px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="sparkle" aria-hidden="true">✦</div>
    <p>A little something to brighten your day</p>
    <h1>Hello, <span>world!</span></h1>
    <div class="message" id="message" aria-live="polite">Thanks for stopping by. Make yourself at home.</div>
    <button id="greet-button" type="button">Send a little joy ✨</button>
  </main>
  <script>
    const button = document.querySelector("#greet-button");
    const message = document.querySelector("#message");
    const greetings = [
      "You’re doing great. Keep being you!",
      "A fresh start can begin with one small step.",
      "Thanks for stopping by. Make yourself at home."
    ];
    let greetingIndex = 0;

    button.addEventListener("click", () => {
      message.textContent = greetings[greetingIndex];
      greetingIndex = (greetingIndex + 1) % greetings.length;
    });
  </script>
</body>
</html>
